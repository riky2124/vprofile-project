apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vprofile-app-ingress
  labels:
    project: vprofile
    app: vprofile-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: vprofile.tr0jan.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vprofile-app-service
                port:
                  number: 8080
